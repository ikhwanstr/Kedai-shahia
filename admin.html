<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Kedai Shahia</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .box {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px #0001;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      border: 0;
      padding: 11px 15px;
      border-radius: 9px;
      cursor: pointer;
      margin: 4px;
      font-size: 14px;
    }

    .primary {
      background: #16a34a;
      color: white;
    }

    .edit {
      background: #2563eb;
      color: white;
    }

    .hapus {
      background: #dc2626;
      color: white;
    }

    .status {
      background: #f59e0b;
      color: white;
    }

    .logout {
      background: #dc2626;
      color: white;
      float: right;
    }

    .menu-item,
    .order-item {
      border: 1px solid #ddd;
      padding: 14px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .order-item {
      background: #fafafa;
    }

    .error {
      color: #dc2626;
      text-align: center;
      margin-top: 10px;
    }

    .success {
      color: #16a34a;
      text-align: center;
    }

    .muted {
      color: #666;
      font-size: 13px;
    }

    #adminPanel {
      display: none;
    }

    #loginBox {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 2px 10px #0002;
    }

    .order-item select {
      width: auto;
      min-width: 160px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🍔 Admin Kedai Shahia</h1>
    <p>Kelola menu dan pesanan</p>
  </header>

  <!-- LOGIN -->
  <div id="loginBox">

    <h2>🔐 Login Admin</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email Admin"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Kata Sandi Admin"
    >

    <button
      class="primary"
      style="width:100%;"
      onclick="loginAdmin()"
    >
      🔑 MASUK
    </button>

    <div id="loginError" class="error"></div>

  </div>


  <!-- PANEL ADMIN -->
  <div id="adminPanel">

    <main>

      <button class="logout" onclick="logoutAdmin()">
        🚪 Keluar
      </button>

      <h2>Dashboard Admin</h2>

      <!-- MENU -->
      <div class="box">

        <h3>🍔 Daftar Menu</h3>

        <input
          id="nama"
          type="text"
          placeholder="Nama menu"
        >

        <input
          id="harga"
          type="number"
          placeholder="Harga"
        >

        <button class="primary" onclick="tambahMenu()">
          ➕ Tambah Menu
        </button>

        <div id="menuMessage" class="success"></div>

        <div id="daftarMenu">
          Memuat menu...
        </div>

      </div>


      <!-- PESANAN -->
      <div class="box">

        <h3>📦 Pesanan Masuk</h3>

        <div id="daftarPesanan">
          Memuat pesanan...
        </div>

      </div>

    </main>

  </div>


<script>

  // =========================
  // SUPABASE
  // =========================

  const SUPABASE_URL =
    "https://bkcshfgzerlripxxpfuz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Nnc8yoURO-nJ32EcHWtDfA_zLmlMnnl";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // LOGIN
  // =========================

  async function loginAdmin() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const errorBox =
      document.getElementById("loginError");

    errorBox.textContent = "";

    if (!email || !password) {

      errorBox.textContent =
        "Email dan password wajib diisi.";

      return;
    }

    errorBox.textContent =
      "Sedang masuk...";

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      errorBox.textContent =
        "Login gagal: " + error.message;

      return;
    }

    errorBox.textContent = "";

    tampilkanAdmin();
  }


  // =========================
  // CEK LOGIN
  // =========================

  async function cekLogin() {

    const {
      data: {
        session
      }
    } = await supabaseClient.auth.getSession();

    if (session) {

      tampilkanAdmin();

    } else {

      document.getElementById("loginBox")
        .style.display = "block";

      document.getElementById("adminPanel")
        .style.display = "none";
    }
  }


  function tampilkanAdmin() {

    document.getElementById("loginBox")
      .style.display = "none";

    document.getElementById("adminPanel")
      .style.display = "block";

    muatMenu();
    muatPesanan();
  }


  // =========================
  // LOGOUT
  // =========================

  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    location.reload();
  }


  // =========================
  // MENU
  // =========================

  async function muatMenu() {

    const container =
      document.getElementById("daftarMenu");

    container.innerHTML =
      "Memuat menu...";

    const {
      data,
      error
    } = await supabaseClient
      .from("produk")
      .select("*")
      .order("nama", {
        ascending: true
      });

    if (error) {

      container.innerHTML =
        "❌ Gagal mengambil menu:<br>" +
        error.message;

      return;
    }

    if (!data || data.length === 0) {

      container.innerHTML =
        "Belum ada menu.";

      return;
    }

    container.innerHTML = "";

    data.forEach(menu => {

      const item =
        document.createElement("div");

      item.className =
        "menu-item";

      const nama =
        escapeHTML(menu.nama || "-");

      const harga =
        Number(menu.harga || 0);

      item.innerHTML = `

        <b>${nama}</b><br>

        <strong>
          Rp${formatRupiah(harga)}
        </strong>

        <br>

        <span class="muted">
          ${menu.aktif
            ? "🟢 Aktif"
            : "🔴 Tidak aktif"}
        </span>

        <br><br>

        <button
          class="edit"
          onclick="editMenu(
            '${escapeJS(menu.pengenal)}',
            '${escapeJS(menu.nama || "")}',
            '${harga}'
          )"
        >
          ✏️ Edit
        </button>

        <button
          class="status"
          onclick="ubahAktif(
            '${escapeJS(menu.pengenal)}',
            ${menu.aktif}
          )"
        >
          ${menu.aktif
            ? "🔴 Nonaktifkan"
            : "🟢 Aktifkan"}
        </button>

        <button
          class="hapus"
          onclick="hapusMenu(
            '${escapeJS(menu.pengenal)}'
          )"
        >
          🗑️ Hapus
        </button>

      `;

      container.appendChild(item);

    });
  }


  // =========================
  // TAMBAH MENU
  // =========================

  async function tambahMenu() {

    const nama =
      document
        .getElementById("nama")
        .value
        .trim();

    const harga =
      Number(
        document
          .getElementById("harga")
          .value
      );

    const message =
      document.getElementById("menuMessage");

    message.textContent = "";

    if (!nama || !harga) {

      alert(
        "Nama dan harga wajib diisi."
      );

      return;
    }

    const {
      error
    } = await supabaseClient
      .from("produk")
      .insert({
        nama: nama,
        harga: harga,
        aktif: true
      });

    if (error) {

      alert(
        "Gagal menambah menu:\n" +
        error.message
      );

      return;
    }

    document.getElementById("nama")
      .value = "";

    document.getElementById("harga")
      .value = "";

    message.textContent =
      "✅ Menu berhasil ditambahkan.";

    muatMenu();
  }


  // =========================
  // EDIT MENU
  // =========================

  async function editMenu(
    pengenal,
    namaLama,
    hargaLama
  ) {

    const namaBaru =
      prompt(
        "Nama menu:",
        namaLama
      );

    if (namaBaru === null) {
      return;
    }

    const hargaBaru =
      prompt(
        "Harga:",
        hargaLama
      );

    if (hargaBaru === null) {
      return;
    }

    if (!namaBaru.trim() || !hargaBaru) {

      alert(
        "Nama dan harga wajib diisi."
      );

      return;
    }

    const {
      error
    } = await supabaseClient
      .from("produk")
      .update({
        nama: namaBaru.trim(),
        harga: Number(hargaBaru)
      })
      .eq("pengenal", pengenal);

    if (error) {

      alert(
        "Gagal mengubah menu:\n" +
        error.message
      );

      return;
    }

    muatMenu();
  }


  // =========================
  // AKTIF / NONAKTIF
  // =========================

  async function ubahAktif(
    pengenal,
    aktif
  ) {

    const {
      error
    } = await supabaseClient
      .from("produk")
      .update({
        aktif: !aktif
      })
      .eq("pengenal", pengenal);

    if (error) {

      alert(
        "Gagal mengubah status:\n" +
        error.message
      );

      return;
    }

    muatMenu();
  }


  // =========================
  // HAPUS MENU
  // =========================

  async function hapusMenu(
    pengenal
  ) {

    if (
      !confirm(
        "Hapus menu ini?"
      )
    ) {
      return;
    }

    const {
      error
    } = await supabaseClient
      .from("produk")
      .delete()
      .eq("pengenal", pengenal);

    if (error) {

      alert(
        "Gagal menghapus menu:\n" +
        error.message
      );

      return;
    }

    muatMenu();
  }


  // =========================
  // PESANAN
  // =========================

  async function muatPesanan() {

    const container =
      document.getElementById(
        "daftarPesanan"
      );

    container.innerHTML =
      "Memuat pesanan...";

    const {
      data,
      error
    } = await supabaseClient
      .from("perintah")
      .select("*")
      .order(
        "dibuat_pada",
        {
          ascending: false
        }
      );

    if (error) {

      container.innerHTML =
        "❌ Gagal mengambil pesanan:<br>" +
        error.message;

      return;
    }

    if (!data || data.length === 0) {

      container.innerHTML =
        "Belum ada pesanan.";

      return;
    }

    container.innerHTML = "";

    data.forEach(pesanan => {

      const item =
        document.createElement("div");

      item.className =
        "order-item";

      item.innerHTML = `

        <b>
          👤 ${escapeHTML(
            pesanan.nama_pelanggan || "-"
          )}
        </b>

        <br>

        📞 ${escapeHTML(
          pesanan.telepon || "-"
        )}

        <br>

        📍 ${escapeHTML(
          pesanan.alamat || "-"
        )}

        <br><br>

        ${formatItem(
          pesanan["barang-barang"]
        )}

        <br>

        💰 <b>
          Rp${formatRupiah(
            pesanan.total || 0
          )}
        </b>

        <br><br>

        📌 Status:

        <select
          onchange="ubahStatus(
            '${escapeJS(pesanan.pengenal)}',
            this.value
          )"
        >

          <option
            value="baru"
            ${pesanan.status === "baru"
              ? "selected"
              : ""}
          >
            Baru
          </option>

          <option
            value="diproses"
            ${pesanan.status === "diproses"
              ? "selected"
              : ""}
          >
            Diproses
          </option>

          <option
            value="selesai"
            ${pesanan.status === "selesai"
              ? "selected"
              : ""}
          >
            Selesai
          </option>

          <option
            value="dibatalkan"
            ${pesanan.status === "dibatalkan"
              ? "selected"
              : ""}
          >
            Dibatalkan
          </option>

        </select>

      `;

      container.appendChild(item);
    });
  }


  // =========================
  // FORMAT BARANG
  // =========================

  function formatItem(barang) {

    if (!barang) {
      return "-";
    }

    if (typeof barang === "string") {

      try {
        barang = JSON.parse(barang);
      } catch (e) {
        return escapeHTML(barang);
      }
    }

    if (!Array.isArray(barang)) {
      return "-";
    }

    return barang.map(item => {

      const nama =
        escapeHTML(
          item.nama || "-"
        );

      const jumlah =
        Number(
          item.jumlah || 0
        );

      const subtotal =
        Number(
          item.subtotal || 0
        );

      return `
        <div>
          🛒 ${nama}
          × ${jumlah}
          = Rp${formatRupiah(subtotal)}
        </div>
      `;

    }).join("");
  }


  // =========================
  // UBAH STATUS PESANAN
  // =========================

  async function ubahStatus(
    pengenal,
    status
  ) {

    const {
      error
    } = await supabaseClient
      .from("perintah")
      .update({
        status: status
      })
      .eq("pengenal", pengenal);

    if (error) {

      alert(
        "Gagal mengubah status pesanan:\n" +
        error.message
      );

      return;
    }

    muatPesanan();
  }


  // =========================
  // UTILITAS
  // =========================

  function formatRupiah(angka) {

    return Number(angka || 0)
      .toLocaleString("id-ID");
  }


  function escapeHTML(teks) {

    const div =
      document.createElement("div");

    div.textContent =
      String(teks);

    return div.innerHTML;
  }


  function escapeJS(teks) {

    return String(teks)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }


  // =========================
  // AUTO CEK LOGIN
  // =========================

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (session) {
        tampilkanAdmin();
      }

    }
  );


  // MULAI
  cekLogin();

</script>

</body>
</html>
