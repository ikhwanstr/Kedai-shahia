<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Kedai Shahia</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f4f5;
  color:#18181b;
}
header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}
main{
  max-width:900px;
  margin:auto;
  padding:15px;
}
.box{
  background:white;
  padding:18px;
  border-radius:15px;
  margin:15px 0;
  box-shadow:0 2px 8px #0001;
}
input,select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:9px;
  box-sizing:border-box;
}
button{
  padding:11px 15px;
  border:0;
  border-radius:9px;
  cursor:pointer;
  margin:4px;
}
.tambah{background:#16a34a;color:white}
.edit{background:#2563eb;color:white}
.hapus{background:#dc2626;color:white}
.status{background:#f59e0b;color:white}
.item{
  border:1px solid #ddd;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}
small{color:#666}

.order-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:start;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid #eee;
  font-size:15px;
  line-height:1.4;
}

.order-item span{
  min-width:0;
  overflow-wrap:anywhere;
}

.order-item b{
  white-space:nowrap;
  text-align:right;
  font-size:15px;
}

.order-time{
  background:#f3f4f6;
  padding:8px;
  border-radius:8px;
  margin:8px 0;
  font-size:13px;
  color:#555;
}

.status-label{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  font-weight:bold;
}
#loginBox{
  max-width:420px;
  margin:60px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 2px 10px #ccc;
}

#loginBox h2{
  text-align:center;
  margin-top:0;
}

#loginBox input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:9px;
  box-sizing:border-box;
}

#loginBtn{
  width:100%;
  background:#16a34a;
  color:white;
  border:0;
  padding:13px;
  border-radius:9px;
  font-size:16px;
  cursor:pointer;
}

#loginError{
  color:#dc2626;
  margin-top:12px;
  text-align:center;
}

#adminPanel{
  display:none;
}</style>
</head>

<body><div id="loginBox">
  <h2>🔐 Login Admin</h2>

  <input
    id="loginEmail"
    type="email"
    placeholder="Email Admin"
  >

  <input
    id="loginPassword"
    type="password"
    placeholder="Password Admin"
  >

  <button id="loginBtn" onclick="loginAdmin()">
    🔑 MASUK
  </button>

  <div id="loginError"></div>
</div>

<div id="adminPanel">

<header>
<h2>🍔 Admin Kedai Shahia</h2>
<p>Kelola menu dan pesanan</p>
</header>

<main>

<div class="box">
<h3>📋 Daftar Menu</h3>

<input id="nama" placeholder="Nama menu">
<input id="harga" type="number" placeholder="Harga">
<button class="tambah" onclick="tambahMenu()">➕ Tambah Menu</button>

<div id="daftarMenu">Memuat menu...</div>
</div>

<div class="box">
<h3>📦 Pesanan Masuk</h3>
<div id="daftarPesanan">Memuat pesanan...</div>
</div>

</main>

<script>

const SUPABASE_URL =
"https://bkcshfgzerlripxxpfuz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Nnc8yoURO-nJ32EcHWtDfA_zLmlMnnl";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);async function loginAdmin(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const errorBox =
    document.getElementById("loginError");

  if(!email || !password){
    errorBox.textContent =
      "Email dan password wajib diisi.";
    return;
  }

  errorBox.textContent = "Sedang masuk...";

  const { error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){
    errorBox.textContent =
      "Login gagal: " + error.message;
    return;
  }

  errorBox.textContent = "";

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";

  loadMenu();
  loadOrders();
}

async function cekLogin(){

  const {
    data: { session }
  } = await db.auth.getSession();

  if(session){

    document.getElementById("loginBox").style.display =
      "none";

    document.getElementById("adminPanel").style.display =
      "block";

    loadMenu();
    loadOrders();

  }else{

    document.getElementById("loginBox").style.display =
      "block";

    document.getElementById("adminPanel").style.display =
      "none";
  }
}

async function logoutAdmin(){

  await db.auth.signOut();

  location.reload();
}


/* =========================
   MENU
========================= */

async function loadMenu(){

  const {data,error} = await db
    .from("products")
    .select("*")
    .order("id");

  if(error){
    document.getElementById("daftarMenu").innerHTML =
      "❌ Gagal mengambil menu: " + error.message;
    return;
  }

  let html="";

  data.forEach(m=>{

    html += `
    <div class="item">

      <b>${m.name}</b><br>

      <span>
      Rp ${Number(m.price).toLocaleString("id-ID")}
      </span><br>

      <small>
      Status:
      ${m.active ? "🟢 Aktif" : "🔴 Nonaktif"}
      </small>

      <br>

      <button class="edit"
        onclick="editMenu(${m.id}, '${escapeText(m.name)}', ${m.price})">
        ✏️ Edit
      </button>

      <button class="status"
        onclick="ubahAktif(${m.id}, ${!m.active})">
        ${m.active ? "🔴 Nonaktifkan" : "🟢 Aktifkan"}
      </button>

      <button class="hapus"
        onclick="hapusMenu(${m.id})">
        🗑️ Hapus
      </button>

    </div>
    `;
  });

  document.getElementById("daftarMenu").innerHTML =
    html || "Belum ada menu.";

}


function escapeText(text){

  return String(text)
    .replace(/'/g,"\\'")
    .replace(/"/g,'&quot;');

}


async function tambahMenu(){

  const nama =
    document.getElementById("nama").value.trim();

  const harga =
    Number(document.getElementById("harga").value);

  if(!nama || !harga){

    alert("Nama dan harga wajib diisi.");
    return;
  }

  const {error} = await db
    .from("products")
    .insert({
      name:nama,
      price:harga,
      active:true
    });

  if(error){

    alert("Gagal menambah menu:\n"+error.message);
    return;
  }

  document.getElementById("nama").value="";
  document.getElementById("harga").value="";

  loadMenu();

}


async function editMenu(id,nama,harga){

  const namaBaru =
    prompt("Nama menu:",nama);

  if(namaBaru===null) return;

  const hargaBaru =
    prompt("Harga:",harga);

  if(hargaBaru===null) return;

  const {error} = await db
    .from("products")
    .update({
      name:namaBaru,
      price:Number(hargaBaru)
    })
    .eq("id",id);

  if(error){

    alert("Gagal mengubah menu:\n"+error.message);
    return;
  }

  loadMenu();

}


async function ubahAktif(id,aktif){

  const {error} = await db
    .from("products")
    .update({active:aktif})
    .eq("id",id);

  if(error){

    alert("Gagal mengubah status:\n"+error.message);
    return;
  }

  loadMenu();

}


async function hapusMenu(id){

  if(!confirm("Hapus menu ini?")) return;

  const {error} = await db
    .from("products")
    .delete()
    .eq("id",id);

  if(error){

    alert("Gagal menghapus menu:\n"+error.message);
    return;
  }

  loadMenu();

}


/* =========================
   PESANAN
========================= */

async function loadOrders(){

  const {data,error} = await db
    .from("orders")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    document.getElementById("daftarPesanan").innerHTML =
      "❌ Gagal mengambil pesanan: " + error.message;

    return;
  }

  let html="";

  data.forEach(o=>{

    html += `
    <div class="item">

      <b>👤 ${o.customer_name || "-"}</b><br>

      📱 ${o.phone || "-"}<br>

      📍 ${o.address || "-"}<br>

      🛒 ${formatItems(o.items)}<br>

      💰 <b>
      Rp ${Number(o.total || 0).toLocaleString("id-ID")}
      </b><br>

      📌 Status:
      <b>${o.status || "-"}</b>

      <br>

      <select
        onchange="ubahStatus(${o.id},this.value)">

        <option value="baru"
          ${o.status==="baru"?"selected":""}>
          Baru
        </option>

        <option value="diproses"
          ${o.status==="diproses"?"selected":""}>
          Diproses
        </option>

        <option value="selesai"
          ${o.status==="selesai"?"selected":""}>
          Selesai
        </option>

        <option value="dibatalkan"
          ${o.status==="dibatalkan"?"selected":""}>
          Dibatalkan
        </option>

      </select>

    </div>
    `;
  });

  document.getElementById("daftarPesanan").innerHTML =
    html || "Belum ada pesanan.";

}


function formatItems(items){

  if(!items) return "-";

  if(typeof items === "string"){
    try{
      items = JSON.parse(items);
    }catch(e){
      return items;
    }
  }

  if(!Array.isArray(items)){
    return "-";
  }

  let html = "";

  items.forEach(item => {

    const nama = escapeHtml(item.name || "-");
    const qty = Number(item.qty || 0);
    const subtotal = Number(item.subtotal || 0);
html += `
  <div class="order-item">
    <span class="item-name">🍔 ${nama}</span>
    <span class="item-qty">×${qty}</span>
    <b class="item-price">Rp ${subtotal.toLocaleString("id-ID")}</b>
  </div>
`;
    

  });

  return html || "-";
}


function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


async function ubahStatus(id,status){

  const {error} = await db
    .from("orders")
    .update({status:status})
    .eq("id",id);

  if(error){

    alert("Gagal mengubah status pesanan:\n"+error.message);
    return;
  }

  loadOrders();

}


/* =========================
   MULAI
========================= */

cekLogin();

</script>

</body>
</html>
