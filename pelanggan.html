<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedai Shahia</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8f0;
  color:#222;
}

header{
  background:#d84315;
  color:white;
  text-align:center;
  padding:28px 15px;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:8px 0 0;
  font-size:20px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.hero{
  background:white;
  padding:25px 18px;
  border-radius:20px;
  margin-bottom:22px;
  text-align:center;
  box-shadow:0 3px 12px #ddd;
}

.hero h2{
  margin:0 0 5px;
  font-size:32px;
}

.hero p{
  margin:5px;
  color:#666;
  font-size:20px;
}

h2{
  margin-top:25px;
}

.product{
  background:white;
  padding:15px;
  margin:10px 0;
  border-radius:16px;
  box-shadow:0 3px 10px #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.product-info{
  flex:1;
}

.product-name{
  font-weight:bold;
  font-size:18px;
}

.price{
  color:#d84315;
  font-weight:bold;
  margin-top:5px;
  font-size:18px;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.minus,.plus{
  background:#d84315;
  color:white;
}

.qty{
  min-width:25px;
  text-align:center;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:25px;
  color:#666;
}

.error{
  background:#ffebee;
  color:#c62828;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
}

.cart{
  position:sticky;
  bottom:10px;
  background:#222;
  color:white;
  padding:18px;
  border-radius:25px;
  margin-top:20px;
  box-shadow:0 5px 20px #999;
}

.cart-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cart-items{
  font-size:16px;
  margin-bottom:5px;
}

.total{
  font-size:28px;
  font-weight:bold;
}

.wa{
  width:100%;
  margin-top:15px;
  background:#25D366;
  color:white;
  font-size:20px;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

@media(max-width:500px){
  header h1{font-size:30px}
  .product-name{font-size:17px}
  .hero h2{font-size:28px}
}
</style>
</head>

<body>

<header>
  <h1>🍔 KEDAI SHAHIA</h1>
  <p>JAJANAN RAMAH DIKANTONG</p>
</header>

<div class="container">

  <div class="hero">
    <h2>🛒 Pesan Sekarang</h2>
    <p>Pilih menu favorit kamu dan pesan langsung melalui WhatsApp.</p>
  </div>

  <h2>🍴 Menu</h2>

  <div id="menu">
    <div class="loading">⏳ Memuat menu...</div>
  </div>

  <div class="cart">
    <div class="cart-top">
      <div>
        <div class="cart-items" id="jumlah">0 item</div>
        <div class="total" id="total">Rp0</div>
      </div>
    </div>

    <button class="wa" onclick="pesanWhatsApp()">
      📱 PESAN VIA WHATSAPP
    </button>
  </div>

</div>

<script>

/* ==============================
   PENGATURAN SUPABASE
   ============================== */

const SUPABASE_URL =
"https://bkchsfgerlripxxpfuz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Nnc8yoURO-nJ32EcHWtDfA_zLmlMnnl";

/* Nomor WhatsApp Kedai Shahia */
const NOMOR_WA = "6289513623864";


/* ==============================
   DATA
   ============================== */

let produk = [];
let keranjang = {};


/* ==============================
   FORMAT RUPIAH
   ============================== */

function rupiah(angka){
  return "Rp" + Number(angka).toLocaleString("id-ID");
}


/* ==============================
   AMBIL MENU DARI SUPABASE
   ============================== */

async function ambilMenu(){

  const menuEl = document.getElementById("menu");

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/menu?select=*",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error("Gagal mengambil menu");
    }

    produk = await response.json();

    if(!produk.length){
      menuEl.innerHTML =
        '<div class="empty">Belum ada menu tersedia.</div>';
      return;
    }

    tampilkanMenu();

  }catch(error){

    console.error(error);

    menuEl.innerHTML =
      '<div class="error">' +
      '❌ Menu belum dapat dimuat.<br>' +
      'Silakan coba refresh halaman.' +
      '</div>';
  }
}


/* ==============================
   TAMPILKAN MENU
   ============================== */

function tampilkanMenu(){

  const menuEl = document.getElementById("menu");

  menuEl.innerHTML = "";

  produk.forEach((item,index)=>{

    keranjang[item.id] = keranjang[item.id] || 0;

    const div = document.createElement("div");

    div.className = "product";

    div.innerHTML = `
      <div class="product-info">
        <div class="product-name">
          ${escapeHTML(item.nama)}
        </div>

        <div class="price">
          ${rupiah(item.harga)}
        </div>
      </div>

      <div class="controls">

        <button
          class="minus"
          onclick="ubahJumlah(${item.id},-1)">
          −
        </button>

        <div
          class="qty"
          id="qty-${item.id}">
          ${keranjang[item.id]}
        </div>

        <button
          class="plus"
          onclick="ubahJumlah(${item.id},1)">
          +
        </button>

      </div>
    `;

    menuEl.appendChild(div);
  });

  hitungTotal();
}


/* ==============================
   UBAH JUMLAH
   ============================== */

function ubahJumlah(id,perubahan){

  keranjang[id] =
    (keranjang[id] || 0) + perubahan;

  if(keranjang[id] < 0){
    keranjang[id] = 0;
  }

  const qty = document.getElementById("qty-" + id);

  if(qty){
    qty.textContent = keranjang[id];
  }

  hitungTotal();
}


/* ==============================
   HITUNG TOTAL
   ============================== */

function hitungTotal(){

  let total = 0;
  let jumlah = 0;

  produk.forEach(item=>{

    const qty = keranjang[item.id] || 0;

    jumlah += qty;
    total += Number(item.harga) * qty;

  });

  document.getElementById("jumlah").textContent =
    jumlah + " item";

  document.getElementById("total").textContent =
    rupiah(total);
}


/* ==============================
   PESAN WHATSAPP
   ============================== */

function pesanWhatsApp(){

  let pesan =
    "Halo Kedai Shahia 👋%0A%0A" +
    "Saya ingin memesan:%0A";

  let adaPesanan = false;
  let total = 0;

  produk.forEach(item=>{

    const qty = keranjang[item.id] || 0;

    if(qty > 0){

      adaPesanan = true;

      const subtotal =
        Number(item.harga) * qty;

      total += subtotal;

      pesan +=
        "- " +
        item.nama +
        " x" +
        qty +
        " = " +
        rupiah(subtotal) +
        "%0A";
    }
  });

  if(!adaPesanan){

    alert("Silakan pilih menu terlebih dahulu 😊");
    return;
  }

  pesan +=
    "%0ATotal: " +
    rupiah(total) +
    "%0A%0A" +
    "Terima kasih 🙏";

  const url =
    "https://wa.me/" +
    NOMOR_WA +
    "?text=" +
    pesan;

  window.open(url,"_blank");
}


/* ==============================
   KEAMANAN TEKS
   ============================== */

function escapeHTML(teks){

  return String(teks)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ==============================
   MULAI
   ============================== */

ambilMenu();

</script>

</body>
</html>
