<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kedai Shahia - Pelanggan</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff8ef;color:#2b1b12}header{background:#d84315;color:#fff;text-align:center;padding:25px 15px}header h1{margin:0;font-size:30px}header p{font-weight:bold}.wrap{max-width:1000px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#ff7043,#ffb300);color:#fff;border-radius:20px;padding:25px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:#fff;border-radius:17px;padding:18px;box-shadow:0 5px 18px #0001}.price{font-size:20px;font-weight:bold;color:#d84315}.qty{display:flex;gap:10px;align-items:center;margin-top:12px}.qty button{border:0;border-radius:9px;width:36px;height:36px;font-size:20px;background:#ffe0b2}.cart{position:fixed;right:15px;bottom:15px;background:#1faa59;color:#fff;padding:15px 18px;border-radius:15px;font-weight:bold;cursor:pointer}.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:bold;cursor:pointer}textarea,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px}</style></head><body>
<header><h1>🍔 KEDAI SHAHIA</h1><p>JAJANAN RAMAH DIKANTONG</p></header><div class="wrap">
<div class="hero"><h2>Pesan Sekarang 😋</h2><p>Pilih menu favoritmu dan kirim pesanan langsung melalui WhatsApp.</p></div>
<h2>Menu</h2><div id="products" class="grid"></div>
<h2>Catatan</h2><textarea id="note" rows="3" placeholder="Contoh: level pedas, alamat, catatan lainnya"></textarea>
</div><div class="cart" onclick="checkout()">🛒 <span id="count">0</span> • <span id="total">Rp0</span></div>
<script>
const WA="6289513623864";
const products=[["AYAM KOCAK PEDAS",12000],["AYAM KOCAK PEDAS KEJU",14000],["AYAM KOCAK KEJU",15000],["KEBAB BEEF PETTIES",13000],["KEBAB CHICKEN",12000],["KEBAB PISANG COKLAT",8000],["KEBAB PISANG COKLAT KEJU",10000],["ROTI BAKAR",5000],["PISANG BAKAR",5000]];
let cart={};const rp=n=>"Rp"+n.toLocaleString("id-ID");
function render(){productsEl=document.getElementById("products");productsEl.innerHTML=products.map((p,i)=>`<div class="card"><h3>${p[0]}</h3><div class="price">${rp(p[1])}</div><div class="qty"><button onclick="chg(${i},-1)">−</button><b>${cart[i]||0}</b><button onclick="chg(${i},1)">+</button></div></div>`).join("");update()}
function chg(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(!cart[i])delete cart[i];render()}
function update(){let c=0,t=0;for(const i in cart){c+=cart[i];t+=cart[i]*products[i][1]}document.getElementById("count").textContent=c;document.getElementById("total").textContent=rp(t)}
function checkout(){if(!Object.keys(cart).length)return alert("Pilih menu terlebih dahulu.");let a=["Halo Kedai Shahia, saya mau pesan:",""],t=0;for(const i in cart){let q=cart[i],p=products[i],s=q*p[1];t+=s;a.push(`${q}x ${p[0]} - ${rp(s)}`)}a.push("",`Total: ${rp(t)}`);let n=document.getElementById("note").value.trim();if(n)a.push(`Catatan: ${n}`);a.push("","Mohon konfirmasi pesanan saya. Terima kasih.");location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(a.join("\n"))}
render();
</script></body></html>
