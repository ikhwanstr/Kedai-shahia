<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedai Shahia</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8f0;
  color:#222;
}

header{
  background:#d84315;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  font-size:20px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.hero{
  background:white;
  padding:25px 18px;
  border-radius:20px;
  margin-bottom:20px;
  text-align:center;
  box-shadow:0 3px 12px #ddd;
}

.hero h2{
  margin:0 0 5px;
  font-size:32px;
}

.hero p{
  margin:5px;
  color:#666;
  font-size:20px;
}

h2.menu-title{
  margin-top:25px;
}

.product{
  background:white;
  padding:15px;
  margin:10px 0;
  border-radius:16px;
  box-shadow:0 3px 10px #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.product-info{
  flex:1;
}

.product-name{
  font-weight:bold;
  font-size:18px;
}

.price{
  color:#d84315;
  font-weight:bold;
  margin-top:5px;
  font-size:18px;
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

.controls button{
  width:68px;
  height:68px;
  border:0;
  border-radius:16px;
  background:#d84315;
  color:white;
  font-size:28px;
  font-weight:bold;
}

.qty{
  min-width:25px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.cart{
  position:sticky;
  bottom:15px;
  background:#222;
  color:white;
  padding:20px;
  border-radius:25px;
  margin-top:20px;
  box-shadow:0 5px 20px #999;
}

.cart-total{
  font-size:28px;
  font-weight:bold;
  margin:5px 0 15px;
}

.wa{
  width:100%;
  padding:17px;
  border:0;
  border-radius:14px;
  background:#25d366;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.status{
  text-align:center;
  padding:15px;
  color:#666;
}
</style>
</head>

<body>

<header>
  <h1>🍔 KEDAI SHAHIA</h1>
  <p>JAJANAN RAMAH DIKANTONG</p>
</header>

<div class="container">

  <div class="hero">
    <h2>🛒 Pesan Sekarang</h2>
    <p>Pilih menu favorit kamu dan pesan langsung melalui WhatsApp.</p>
  </div>

  <h2 class="menu-title">🍴 Menu</h2>

  <div id="menu">
    <div class="status">Memuat menu...</div>
  </div>

  <div class="cart">
    <div id="jumlah">0 item</div>
    <div class="cart-total" id="total">Rp0</div>
    <button class="wa" onclick="pesanWhatsApp()">
      📱 PESAN VIA WHATSAPP
    </button>
  </div>

</div>

<script>

/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL = "https://bkcshfgzerlripxxpfuz.supabase.co/";
const SUPABASE_KEY = "sb_publishable_Nnc8yoURO-nJ32EcHWtDfA_zLmlMnnl";

const WA_NUMBER = "6289513623864";

let produk = [];
let keranjang = {};


/* =========================
   FORMAT RUPIAH
   ========================= */

function rupiah(angka){
  return "Rp" + Number(angka).toLocaleString("id-ID");
}


/* =========================
   AMBIL MENU DARI SUPABASE
   ========================= */

async function loadMenu(){

  const menuBox = document.getElementById("menu");

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/menu?select=id,nama,harga,aktif&aktif=eq.true&order=id.asc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error(await response.text());
    }

    produk = await response.json();

    if(produk.length === 0){
      menuBox.innerHTML =
        '<div class="status">Belum ada menu tersedia.</div>';
      return;
    }

    tampilkanMenu();

  }catch(error){

    console.error(error);

    menuBox.innerHTML =
      '<div class="status">❌ Gagal memuat menu.</div>';
  }
}


/* =========================
   TAMPILKAN MENU
   ========================= */

function tampilkanMenu(){

  const menuBox = document.getElementById("menu");

  menuBox.innerHTML = produk.map(item => {

    const qty = keranjang[item.id] || 0;

    return `
      <div class="product">

        <div class="product-info">
          <div class="product-name">
            ${escapeHtml(item.nama)}
          </div>

          <div class="price">
            ${rupiah(item.harga)}
          </div>
        </div>

        <div class="controls">

          <button onclick="kurang(${item.id})">−</button>

          <div class="qty" id="qty-${item.id}">
            ${qty}
          </div>

          <button onclick="tambah(${item.id})">+</button>

        </div>

      </div>
    `;

  }).join("");

  hitungTotal();
}


/* =========================
   TAMBAH
   ========================= */

function tambah(id){

  keranjang[id] = (keranjang[id] || 0) + 1;

  tampilkanMenu();
}


/* =========================
   KURANG
   ========================= */

function kurang(id){

  if(!keranjang[id]) return;

  keranjang[id]--;

  if(keranjang[id] <= 0){
    delete keranjang[id];
  }

  tampilkanMenu();
}


/* =========================
   HITUNG TOTAL
   ========================= */

function hitungTotal(){

  let total = 0;
  let jumlah = 0;

  produk.forEach(item => {

    const qty = keranjang[item.id] || 0;

    jumlah += qty;
    total += Number(item.harga) * qty;

  });

  document.getElementById("jumlah").innerText =
    jumlah + " item";

  document.getElementById("total").innerText =
    rupiah(total);
}


/* =========================
   PESAN WHATSAPP
   ========================= */

function pesanWhatsApp(){

  let pesan = "Halo Kedai Shahia 👋%0A";
  pesan += "Saya ingin pesan:%0A%0A";

  let total = 0;
  let jumlah = 0;
  let adaPesanan = false;

  produk.forEach(item => {

    const qty = keranjang[item.id] || 0;

    if(qty > 0){

      adaPesanan = true;

      const subtotal =
        Number(item.harga) * qty;

      jumlah += qty;
      total += subtotal;

      pesan +=
        "• " +
        item.nama +
        " x" +
        qty +
        " = " +
        rupiah(subtotal) +
        "%0A";
    }

  });

  if(!adaPesanan){

    alert("Silakan pilih menu terlebih dahulu.");
    return;
  }

  pesan += "%0A";
  pesan += "Total: " + rupiah(total);
  pesan += "%0A%0ATerima kasih 🙏";

  window.open(
    "https://wa.me/" +
    WA_NUMBER +
    "?text=" +
    pesan,
    "_blank"
  );
}


/* =========================
   KEAMANAN TEKS MENU
   ========================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   JALANKAN
   ========================= */

loadMenu();

</script>

</body>
</html>
