<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedai Shahia</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8f0;
  color:#222;
}

header{
  background:#d84315;
  color:white;
  text-align:center;
  padding:28px 15px;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:8px 0 0;
  font-size:18px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.hero{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  text-align:center;
}

.hero h2{
  margin:0 0 8px;
  color:#d84315;
}

.menu{
  display:grid;
  gap:12px;
}

.product{
  background:white;
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.product-name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px;
}

.price{
  color:#d84315;
  font-weight:bold;
  margin-bottom:12px;
}

.qty{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
}

.qty button{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#d84315;
  color:white;
  font-size:22px;
  font-weight:bold;
}

.qty span{
  min-width:30px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.cart{
  background:white;
  margin-top:20px;
  padding:18px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.cart h2{
  margin-top:0;
  color:#d84315;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.total{
  font-size:21px;
  font-weight:bold;
  margin-top:15px;
  text-align:right;
}

.form{
  background:white;
  margin-top:20px;
  padding:18px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.form h2{
  margin-top:0;
  color:#d84315;
}

input,textarea{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.order-btn{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#25d366;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.order-btn:disabled{
  background:#aaa;
}

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

.error{
  background:#ffebee;
  color:#c62828;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.success{
  background:#e8f5e9;
  color:#2e7d32;
  padding:15px;
  border-radius:10px;
  text-align:center;
  margin-top:15px;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>🍔 KEDAI SHAHIA</h1>
  <p>JAJANAN RAMAH DIKANTONG</p>
</header>

<div class="container">

  <div class="hero">
    <h2>🛒 Pesan Sekarang</h2>
    <p>Pilih makanan favorit kamu dan pesan dengan mudah.</p>
  </div>

  <div id="menu" class="menu">
    <div class="loading">Memuat menu...</div>
  </div>

  <div class="cart">
    <h2>🛒 Keranjang</h2>

    <div id="cartItems">
      <div class="empty">Belum ada pesanan.</div>
    </div>

    <div class="total">
      Total: <span id="total">Rp0</span>
    </div>
  </div>

  <div class="form">
    <h2>📋 Data Pemesan</h2>

    <input
      type="text"
      id="customerName"
      placeholder="Nama kamu *"
    >

    <input
      type="tel"
      id="phone"
      placeholder="Nomor HP / WhatsApp *"
    >

    <textarea
      id="address"
      placeholder="Alamat pengantaran *"
    ></textarea>

    <textarea
      id="note"
      placeholder="Catatan tambahan (opsional)"
    ></textarea>

    <button
      class="order-btn"
      id="orderBtn"
      onclick="pesanSekarang()"
    >
      📲 PESAN SEKARANG
    </button>

    <div id="message"></div>
  </div>

</div>

<script>
const SUPABASE_URL =
"https://bkcshfgzerlripxxpfuz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Nnc8yoURO-nJ32EcHWtDfA_zLmlMnnl";

const NOMOR_WA = "6289513623864";

let products = [];
let cart = {};


function formatRupiah(number){
  return new Intl.NumberFormat("id-ID",{
    style:"currency",
    currency:"IDR",
    maximumFractionDigits:0
  }).format(number);
}


async function loadProducts(){

  const menu = document.getElementById("menu");

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/products?select=id,name,price,active&active=eq.true&order=id.asc",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error("Gagal mengambil menu.");
    }

    products = await response.json();

    if(products.length === 0){
      menu.innerHTML =
      '<div class="empty">Menu sedang kosong.</div>';
      return;
    }

    menu.innerHTML = "";

    products.forEach(product => {

      cart[product.id] = 0;

      const div = document.createElement("div");

      div.className = "product";

      div.innerHTML = `
        <div class="product-name">
          ${escapeHtml(product.name)}
        </div>

        <div class="price">
          ${formatRupiah(product.price)}
        </div>

        <div class="qty">

          <button onclick="ubahQty(${product.id},-1)">
            −
          </button>

          <span id="qty-${product.id}">
            0
          </span>

          <button onclick="ubahQty(${product.id},1)">
            +
          </button>

        </div>
      `;

      menu.appendChild(div);

    });

  }catch(error){

    console.error(error);

    menu.innerHTML =
    '<div class="error">Gagal memuat menu. Silakan refresh halaman.</div>';

  }

}


function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


function ubahQty(id, jumlah){

  if(!cart[id]){
    cart[id] = 0;
  }

  cart[id] += jumlah;

  if(cart[id] < 0){
    cart[id] = 0;
  }

  const qtyElement =
  document.getElementById("qty-" + id);

  if(qtyElement){
    qtyElement.textContent = cart[id];
  }

  updateCart();

}


function updateCart(){

  const cartItems =
  document.getElementById("cartItems");

  let total = 0;

  let html = "";

  products.forEach(product => {

    const qty = cart[product.id] || 0;

    if(qty > 0){

      const subtotal =
      qty * product.price;

      total += subtotal;

      html += `
        <div class="cart-item">
          <span>
            ${escapeHtml(product.name)}
            × ${qty}
          </span>

          <strong>
            ${formatRupiah(subtotal)}
          </strong>
        </div>
      `;

    }

  });

  if(html === ""){

    cartItems.innerHTML =
    '<div class="empty">Belum ada pesanan.</div>';

  }else{

    cartItems.innerHTML = html;

  }

  document.getElementById("total").textContent =
  formatRupiah(total);

}


function getOrderItems(){

  const items = [];

  products.forEach(product => {

    const qty = cart[product.id] || 0;

    if(qty > 0){

      items.push({
        id:product.id,
        name:product.name,
        price:product.price,
        qty:qty,
        subtotal:qty * product.price
      });

    }

  });

  return items;

}


async function pesanSekarang(){

  const name =
  document.getElementById("customerName").value.trim();

  const phone =
  document.getElementById("phone").value.trim();

  const address =
  document.getElementById("address").value.trim();

  const note =
  document.getElementById("note").value.trim();

  const message =
  document.getElementById("message");

  const button =
  document.getElementById("orderBtn");

  const items = getOrderItems();

  if(items.length === 0){

    message.innerHTML =
    '<div class="error">Pilih menu terlebih dahulu.</div>';

    return;

  }

  if(!name){

    message.innerHTML =
    '<div class="error">Nama wajib diisi.</div>';

    return;

  }

  if(!phone){

    message.innerHTML =
    '<div class="error">Nomor HP wajib diisi.</div>';

    return;

  }

  if(!address){

    message.innerHTML =
    '<div class="error">Alamat wajib diisi.</div>';

    return;

  }

  let total = 0;

  items.forEach(item => {
    total += item.subtotal;
  });


  button.disabled = true;

  button.textContent =
  "⏳ MENYIMPAN PESANAN...";

  message.innerHTML = "";


  try{

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/orders",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify({
          customer_name:name,
          phone:phone,
          address:address,
          items:items,
          total:total,
          status:"baru"
        })
      }
    );


    if(!response.ok){

      const errorText =
      await response.text();

      console.error(errorText);

      throw new Error(
        "Pesanan gagal disimpan."
      );

    }


    let waMessage =
`🍔 *PESANAN KEDAI SHAHIA*

👤 Nama: ${name}
📱 No HP: ${phone}
📍 Alamat: ${address}

*Pesanan:*`;

    items.forEach(item => {

      waMessage +=
      `\n• ${item.name} x${item.qty} = ${formatRupiah(item.subtotal)}`;

    });


    waMessage +=
    `\n\n💰 *TOTAL: ${formatRupiah(total)}*`;


    if(note){

      waMessage +=
      `\n📝 Catatan: ${note}`;

    }


    waMessage +=
    `\n\nTerima kasih sudah memesan di Kedai Shahia 🙏`;


    message.innerHTML =
    '<div class="success">✅ Pesanan berhasil disimpan! WhatsApp akan dibuka...</div>';


    const waUrl =
    "https://wa.me/" +
    NOMOR_WA +
    "?text=" +
    encodeURIComponent(waMessage);


    setTimeout(() => {

      window.location.href = waUrl;

    },500);


  }catch(error){

    console.error(error);

    message.innerHTML =
    '<div class="error">❌ Pesanan gagal disimpan. Coba lagi.</div>';

    button.disabled = false;

    button.textContent =
    "📲 PESAN SEKARANG";

  }

}


loadProducts();
</script>

</body>
</html>
